<body>
<main class="page">
  <div class="topbar"><div class="brand">Property Details</div><div class="actions"><button class="btn" id="bagBtn">🛒 Cart <span id="bagCount">0</span></button><button class="btn" id="backToListings">← Back</button></div></div>
  <section id="content"><div class="empty">Loading property...</div></section>
</main>
<div id="toast" class="toast"></div>

<!-- Property-page sign-in overlay: keeps the user on this page when Add to Cart requires auth. -->
<div id="propertyAuthOverlay" class="property-auth-overlay" aria-hidden="true">
  <div id="propertyAuthModal" class="property-auth-modal" role="dialog" aria-modal="true" aria-labelledby="propertyAuthTitle">
    <button id="propertyAuthClose" class="property-auth-close" type="button" aria-label="Close">×</button>
    <div class="property-auth-kicker">SHIFT THE STAY / ACCESS</div>
    <h2 id="propertyAuthTitle">Sign in to continue</h2>
    <p>Sign in with Google to add this stay to your Cart.</p>
    <div id="propertyGoogleSignInButton" class="property-google-button"></div>
    <div id="propertyAuthError" class="property-auth-error" aria-live="polite"></div>
  </div>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzaPvD-J4nnSwXudYter54rdz68zeBdVgHQeJWmzyFmLG4GhtTKSrfrHITFTS6nLctD/exec";
const params=new URLSearchParams(location.search);const propertyId=params.get("id");const selectedUniversityId=params.get("universityId");
function backToListings(){
  const ref = document.referrer || "";
  let cameFromListings = false;
  try{
    const u = ref ? new URL(ref, location.href) : null;
    cameFromListings = !!u && /(^|\/)index\.html$/i.test(u.pathname) && u.searchParams.get("view") === "listings";
  }catch(e){}

  // Normal flow: return instantly to the already-rendered listing view.
  if(cameFromListings && history.length > 1){
    history.back();
    return;
  }

  // Fallback for direct links/bookmarks.
  const id = selectedUniversityId || "";
  location.replace("index.html?view=listings&universityId=" + encodeURIComponent(id));
}

let property=null,rooms=[],amenities=[],addons=[],selectedRoom=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function bag(){

  let session = null;

  try{

    session =
      JSON.parse(
        localStorage.getItem(
          "stsStudentSession"
        ) || "null"
      );

  }catch(e){

    session = null;

  }


  if(
    !session ||
    !session.student ||
    !session.student.student_id
  ){

    return [];

  }


  const key =
    "stsBag_" +
    session.student.student_id;


  try{

    return JSON.parse(
      localStorage.getItem(key) ||
      "[]"
    );

  }catch(e){

    return [];

  }

}
function updateBag(){ $("bagCount").textContent=bag().length }

$("backToListings").onclick = backToListings;
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2500)}
function apiReady(){return API_URL&&!API_URL.includes("PASTE_YOUR")}
async function apiGet(p){
  if(!apiReady())throw new Error("Put your Apps Script /exec URL in property.html.");
  const cacheKey="stsPropertyDetails:"+String(p.propertyId||"");
  try{
    const hit=JSON.parse(sessionStorage.getItem(cacheKey)||"null");
    if(hit&&hit.savedAt&&Date.now()-Number(hit.savedAt)<60000&&hit.data){return hit.data}
  }catch(e){}
  const r=await fetch(API_URL+"?"+new URLSearchParams(p),{cache:"default"});
  if(!r.ok){
    if(r.status===404)throw new Error("API request failed (404). Please redeploy the Apps Script Web App and keep the same /exec URL.");
    throw new Error("API request failed ("+r.status+")");
  }
  const data=await r.json();
  if(data&&data.success){try{sessionStorage.setItem(cacheKey,JSON.stringify({savedAt:Date.now(),data}))}catch(e){}}
  return data;
}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function fallbackImg(url){return url||"building.jpg"}
function render(){
  $("content").innerHTML=`
  <section class="hero">
    <img class="cover" loading="eager" decoding="async" src="${esc(fallbackImg(property.cover_image_url))}" onerror="this.src='building.jpg'" alt="">
    <h1 class="title">${esc(property.property_name)}</h1>
    <div class="sub">${esc(property.address)}, ${esc(property.city)} · ${esc(property.gender)} · ${esc(property.property_type)}</div>
    <p class="description">${esc(property.description||"")}</p>
  </section>
  <section><h2 class="section-title">Room Types We Offer</h2><div id="rooms" class="rooms">
    ${rooms.length?rooms.map((r,i)=>`<article class="room ${i===0?"":"unselected"}" data-room="${esc(r.room_type_id)}"><img loading="lazy" decoding="async" src="${esc(fallbackImg(r.image_url))}" onerror="this.src='building.jpg'" alt=""><div class="room-body"><h3>${esc(r.room_type_name)}</h3><div>${esc(r.occupancy)} person${Number(r.occupancy)===1?"":"s"}</div><p class="price">${money(r.price_per_month)} / month</p><span class="select-pill">${i===0?"Selected":"Select"}</span></div></article>`).join(""):"<div class='empty'>No room types are currently available.</div>"}
  </div></section>
  <section><h2 class="section-title">Amenities & Facilities</h2><div class="amenities">${amenities.length?amenities.map(a=>`<span class="amenity">✓ ${esc(a.facility_name)}</span>`).join(""):"<div class='empty'>No free facilities listed.</div>"}</div></section>
  <section><h2 class="section-title">Optional Facilities</h2><div class="addons">${addons.length?addons.map(a=>`<div class="addon"><label><input type="checkbox" data-addon="${esc(a.facility_id)}"><span><strong>${esc(a.facility_name)}</strong><br><small>${esc(a.description||"Optional facility")}</small></span></label><span class="addon-price">+ ${money(a.price_per_month)}</span></div>`).join(""):"<div class='empty'>No paid optional facilities are currently offered.</div>"}</div></section>
  <div class="summary"><div>Selected: <strong id="selectedRoomText"></strong><br><span id="totalText"></span> per month</div><div class="summary-actions"><button class="primary" id="addBag">ADD TO CART</button><a href="bag.html" class="secondary cart-link" id="goBag">Go to Cart <span aria-hidden="true">→</span></a></div></div>`;
  selectedRoom=rooms[0]||null;updateRoomStyles();bind();
}
function updateRoomStyles(){
 document.querySelectorAll(".room").forEach(el=>{const active=selectedRoom&&el.dataset.room===String(selectedRoom.room_type_id);el.classList.toggle("selected",active);const pill=el.querySelector(".select-pill");if(pill)pill.textContent=active?"✓ Selected":"Select"});
 const extra=[...document.querySelectorAll("[data-addon]:checked")].reduce((s,e)=>{const a=addons.find(x=>String(x.facility_id)===e.dataset.addon);return s+Number(a?.price_per_month||0)},0);
 $("selectedRoomText").textContent=selectedRoom?selectedRoom.room_type_name:"Choose a room";
 $("totalText").textContent=money((selectedRoom?.price_per_month||0)+extra);
}
function bind(){
 document.querySelectorAll(".room").forEach(el=>el.onclick=()=>{selectedRoom=rooms.find(r=>String(r.room_type_id)===el.dataset.room);updateRoomStyles()});
 document.querySelectorAll("[data-addon]").forEach(x=>x.onchange=updateRoomStyles);
 function addSelectedRoomToCart(){

  const session = getPropertyStudentSession();
  if(!session || !session.student || !session.student.student_id){
    toast("Sign in to continue.");
    return;
  }

  /* =========================
     ROOM CHECK
  ========================= */

  if(!selectedRoom){

    toast("Please select a room first.");

    return;

  }


  /* =========================
     SELECTED ADDONS
  ========================= */

  const selectedAddons =
    [...document.querySelectorAll("[data-addon]:checked")]
      .map(e =>
        addons.find(
          a =>
            String(a.facility_id) ===
            e.dataset.addon
        )
      )
      .filter(Boolean);


  /* =========================
     BAG ITEM
  ========================= */

  const item={

    id:
      Date.now().toString(),

    studentId:
      session.student.student_id,

    propertyId:
      property.property_id,

    propertyName:
      property.property_name,

    propertyImage:
      property.cover_image_url || "",

    roomTypeId:
      selectedRoom.room_type_id,

    roomTypeName:
      selectedRoom.room_type_name,

    roomPrice:
      Number(
        selectedRoom.price_per_month || 0
      ),

    addons:
      selectedAddons.map(a=>({

        id:
          a.facility_id,

        name:
          a.facility_name,

        price:
          Number(
            a.price_per_month || 0
          )

      }))

  };


  /* =========================
     STUDENT-SPECIFIC BAG
  ========================= */

  const bagKey =
    "stsBag_" +
    session.student.student_id;


  let b=[];

  try{

    b =
      JSON.parse(
        localStorage.getItem(bagKey) ||
        "[]"
      );

  }catch(e){

    b=[];

  }


 /* =========================
   PREVENT DUPLICATE ROOM TYPE
   Same accommodation + same room type
   cannot be shortlisted twice.

   Different room types from the same
   accommodation ARE allowed.
========================= */

const alreadyShortlisted = b.some(existing =>

  String(existing.propertyId) ===
    String(item.propertyId)

  &&

  String(existing.roomTypeId) ===
    String(item.roomTypeId)

);


if(alreadyShortlisted){

  toast(
    "This room type is already in your shortlist."
  );

  return;

}


  b.push(item);


  localStorage.setItem(
    bagKey,
    JSON.stringify(b)
  );


  /* Keep old key synced for now */
  localStorage.setItem(
    "stsBag",
    JSON.stringify(b)
  );


  updateBag();

  toast("Added to your shortlist.");


}

$("addBag").onclick=()=>{
  if(!isPropertyStudentLoggedIn()){
    propertyAuthPending = true;
    toast("Sign in to continue.");
    setTimeout(openPropertyAuth, 350);
    return;
  }
  addSelectedRoomToCart();
};
}

/* =====================================================
   PROPERTY-PAGE GOOGLE AUTH
===================================================== */
const PROPERTY_AUTH_SESSION_KEY="stsStudentSession";
const PROPERTY_GOOGLE_CLIENT_ID="196772290485-4dgurhk02s06hko2vsfagql92np107t8.apps.googleusercontent.com";
let propertyGoogleInitialized=false;
let propertyAuthPending=false;

function getPropertyStudentSession(){
  try{return JSON.parse(localStorage.getItem(PROPERTY_AUTH_SESSION_KEY)||"null")}catch(e){return null}
}
function isPropertyStudentLoggedIn(){
  const session=getPropertyStudentSession();
  return !!(session&&session.session_token&&session.student&&session.student.student_id);
}
function setPropertyAuthError(message){
  const el=$("propertyAuthError");
  if(el)el.textContent=message||"";
}
function openPropertyAuth(){
  setPropertyAuthError("");
  const overlay=$("propertyAuthOverlay");
  if(!overlay)return;
  overlay.classList.add("is-open");
  overlay.setAttribute("aria-hidden","false");
  initializePropertyGoogle();
}
function closePropertyAuth(){
  const overlay=$("propertyAuthOverlay");
  if(!overlay)return;
  overlay.classList.remove("is-open");
  overlay.setAttribute("aria-hidden","true");
  setPropertyAuthError("");
}
async function handlePropertyGoogleCredential(response){
  setPropertyAuthError("");
  if(!response||!response.credential){
    setPropertyAuthError("Google sign-in did not return a valid credential.");
    return;
  }
  try{
    setPropertyAuthError("Signing you in...");
    const result=await apiPost({action:"googleLogin",id_token:response.credential});
    if(!result||!result.success)throw new Error(result&&result.error?result.error:"Google sign-in failed.");
    localStorage.setItem(PROPERTY_AUTH_SESSION_KEY,JSON.stringify({session_token:result.session_token,student:result.student,logged_in_at:Date.now()}));
    updateBag();
    closePropertyAuth();
    toast("You're signed in. You can now add this stay to your Cart.");
    propertyAuthPending=false;
  }catch(error){
    console.error("Google login error:",error);
    setPropertyAuthError(error.message||"Unable to sign in with Google.");
  }
}
function initializePropertyGoogle(){
  if(propertyGoogleInitialized){renderPropertyGoogleButton();return;}
  if(window.google&&google.accounts&&google.accounts.id){setupPropertyGoogleIdentity();return;}
  const existing=document.querySelector('script[data-google-gsi="true"]');
  if(existing){
    existing.addEventListener("load",setupPropertyGoogleIdentity,{once:true});
    return;
  }
  const script=document.createElement("script");
  script.src="https://accounts.google.com/gsi/client";
  script.async=true;script.defer=true;script.dataset.googleGsi="true";
  script.onload=setupPropertyGoogleIdentity;
  script.onerror=()=>setPropertyAuthError("Unable to load Google Sign-In. Check your internet connection.");
  document.head.appendChild(script);
}
function setupPropertyGoogleIdentity(){
  if(!window.google||!google.accounts||!google.accounts.id){
    setPropertyAuthError("Google Sign-In is unavailable right now.");
    return;
  }
  google.accounts.id.initialize({client_id:PROPERTY_GOOGLE_CLIENT_ID,callback:handlePropertyGoogleCredential,auto_select:false,cancel_on_tap_outside:true});
  propertyGoogleInitialized=true;
  renderPropertyGoogleButton();
}
function renderPropertyGoogleButton(){
  const container=$("propertyGoogleSignInButton");
  if(!container||!window.google||!google.accounts||!google.accounts.id)return;
  container.innerHTML="";
  google.accounts.id.renderButton(container,{type:"standard",theme:"outline",size:"large",text:"signin_with",shape:"pill",width:280});
}
$("propertyAuthClose").onclick=closePropertyAuth;
$("propertyAuthOverlay").addEventListener("click",e=>{if(e.target===$("propertyAuthOverlay"))closePropertyAuth()});

$("bagBtn").onclick=()=>location.href="bag.html";
async function load(){
 try{const d=await apiGet({action:"propertyDetails",propertyId});if(!d.success)throw new Error(d.error||"Property not found.");property=d.property;rooms=d.roomTypes||[];amenities=d.amenities||[];addons=d.addOns||[];render();updateBag()}catch(e){$("content").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
updateBag();load();
</script>

<script id="sts-award-v5-property-motion">
(() => {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const progress = document.createElement('div'); progress.className='sts-progress'; document.body.appendChild(progress);
  const update=()=>{const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);progress.style.width=Math.min(100,scrollY/max*100)+'%'};
  addEventListener('scroll',update,{passive:true});update();
  if(reduced)return;
  const reveal=()=>{document.querySelectorAll('.hero,.room,.amenity,.addon,.summary').forEach(el=>el.classList.add('reveal'));setTimeout(()=>document.querySelectorAll('.reveal').forEach(el=>el.classList.add('is-in')),50)};
  const observer=new MutationObserver(()=>reveal()); observer.observe(document.getElementById('content'),{childList:true,subtree:true});
  reveal();
  if(window.matchMedia('(pointer:fine)').matches){
    document.addEventListener('pointermove',e=>{
      const el=e.target.closest('.room,.addon'); if(!el)return; const r=el.getBoundingClientRect(); el.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');el.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
    });
  }
})();
</script>

</body>
</html>
