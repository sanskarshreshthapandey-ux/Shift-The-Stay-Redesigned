<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Your Cart — Shift The Stay</title>

<style>
:root{--green:#3d5630;--dark:#182217;--mint:#c7dc9e;--card:#d6e0e8;--soft:#eef3e7}
*{box-sizing:border-box}
body{margin:0;background:var(--green);color:#fff;font-family:Arial,Helvetica,sans-serif}
.page{min-height:100vh;padding:28px 6% 80px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font:400 50px Georgia,serif}
.actions{display:flex;gap:10px}
.btn{border:1px solid var(--mint);background:transparent;color:var(--mint);border-radius:28px;padding:11px 18px;cursor:pointer}
.title{font:400 65px Georgia,serif;margin:55px 0 10px}
.subtitle{max-width:900px;font-size:17px;line-height:1.7;margin:0 0 28px;color:#f4f6ed}
.notice{max-width:950px;background:#172116;border:1px solid #78915b;border-radius:24px;padding:22px 25px;margin-bottom:22px}
.notice strong{font-size:21px;color:var(--mint)}
.notice p{margin:8px 0 0;line-height:1.6}
.bag-list{display:grid;gap:18px;max-width:950px}
.item{background:var(--card);color:#111;border-radius:23px;padding:20px;display:grid;grid-template-columns:110px 1fr auto;gap:20px;align-items:center;border:3px solid transparent;transition:.2s}

.item-actions{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.select-btn{border:1px solid #3d5630;background:#3d5630;color:#fff;border-radius:22px;padding:10px 15px;cursor:pointer;font-weight:700}
.select-btn.selected-btn{background:#182217;color:var(--mint);border-color:#182217}
.remove{border:0;background:#222;color:#fff;border-radius:20px;padding:9px 14px;cursor:pointer}
.compare{max-width:950px;margin-top:28px;background:#172116;border:1px solid #78915b;border-radius:24px;padding:24px;overflow:auto}

.compare th{color:var(--mint);font-weight:700}
.total{max-width:950px;margin-top:22px;background:#172116;border:1px solid #78915b;border-radius:24px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:20px;color:#f3f1e8;}
.total strong{display:block;font-size:28px;line-height:1.2;color:#f3f1e8;}
.total small{display:block;margin-top:7px;color:#d8e4ca;line-height:1.45;}
.primary{border:0;background:var(--mint);color:#16200f;border-radius:28px;padding:14px 25px;font-weight:800;cursor:pointer}
.primary:disabled{opacity:.45;cursor:not-allowed}

.form-card p{line-height:1.6;color:#e9efe2}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:14px;color:var(--mint)}
.field input,.field select,.country-search{border:1px solid #91a97a;background:#eef3e7;color:#182217;border-radius:12px;padding:13px 14px;font-size:15px;outline:none}
.field select{cursor:pointer}
.phone-wrap{display:grid;grid-template-columns:230px 1fr;gap:10px}
.country-picker{position:relative}
.country-trigger{width:100%;height:46px;border:1px solid #91a97a;background:#eef3e7;color:#182217;border-radius:12px;padding:0 14px;font-size:15px;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between}
.country-trigger span:last-child{font-size:18px}
.country-menu{position:absolute;z-index:50;left:0;right:0;top:52px;background:#eef3e7;border:1px solid #91a97a;border-radius:14px;padding:9px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:none}
.country-menu.open{display:block}
.country-search{width:100%;margin-bottom:8px}
.country-list{max-height:230px;overflow-y:auto;border-radius:10px}
.country-option{width:100%;border:0;background:transparent;color:#182217;text-align:left;padding:10px 11px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.country-option:hover,.country-option.active{background:#d6e0c9}

.phone-number{width:100%}
.course-picker{position:relative}
.course-trigger{width:100%;min-height:46px;border:1px solid #91a97a;background:#eef3e7;color:#182217;border-radius:12px;padding:0 14px;font-size:15px;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px}
.course-trigger span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#687064}

.course-menu{position:absolute;z-index:60;left:0;right:0;top:52px;background:#eef3e7;border:1px solid #91a97a;border-radius:14px;padding:9px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:none}
.course-menu.open{display:block}
.course-search{width:100%;margin-bottom:8px}
.course-list{max-height:240px;overflow-y:auto;border-radius:10px;overscroll-behavior:contain}
.course-option{width:100%;border:0;background:transparent;color:#182217;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.course-option:hover,.course-option.active{background:#d6e0c9}
.course-option.other{font-weight:700;border-top:1px solid #c6d1bc;margin-top:6px;padding-top:14px}

.other-course-wrap[hidden]{display:none}
.other-course-wrap input{width:100%;border:1px solid #91a97a;background:#eef3e7;color:#182217;border-radius:12px;padding:13px 14px;font-size:15px;outline:none}
.field.invalid input,.field.invalid .course-trigger{border-color:#9c5f4f!important;box-shadow:0 0 0 3px rgba(156,95,79,.10)}

.field.invalid .field-error{display:block}
@media(max-width:700px){.phone-wrap{grid-template-columns:1fr}.course-menu{position:fixed;left:12px;right:12px;top:auto;bottom:12px;max-height:min(72vh,520px);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.28)}.course-list{max-height:min(52vh,360px)}}
.form-actions{margin-top:22px;display:flex;justify-content:flex-end}
.receipt{max-width:950px;margin-top:25px;background:#eef3e7;color:#182217;border-radius:24px;padding:28px}
.receipt h2{font:400 35px Georgia,serif;margin:0 0 10px}
.receipt .ok{color:#31501f;font-weight:800}
.receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 25px;margin-top:18px}
.receipt-grid div{padding:10px 0;border-bottom:1px solid #c2cfb6}
.empty{border:1px dashed #a9c18a;border-radius:22px;padding:50px;text-align:center;max-width:800px}
.empty button{margin-top:15px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#fff;color:#111;padding:12px 18px;border-radius:24px;opacity:0;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){
 .item{grid-template-columns:1fr}.item img{width:100%;height:180px}.item-actions{align-items:stretch}
 .total{flex-direction:column;align-items:flex-start}.brand{font-size:38px}.title{font-size:48px}
 .form-grid,.receipt-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
}
</style>

<body>
<main class="page">
  <div class="top">
    <div class="brand">Shift The Stay</div>
    <div class="actions">
      <button class="btn" onclick="history.back()">← Back</button>
    </div>
  </div>
  <h1 class="title">Your Cart 🛒</h1>
  <div id="content"></div>
</main>
<div id="toast" class="toast"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzaPvD-J4nnSwXudYter54rdz68zeBdVgHQeJWmzyFmLG4GhtTKSrfrHITFTS6nLctD/exec";
let selectedIndexes=[];
const MAX_SELECTED=2;

function getStudentSession(){
  try{
    return JSON.parse(localStorage.getItem("stsStudentSession")||"null");
  }catch(e){return null;}
}

function bag(){
  const session=getStudentSession();
  if(!session||!session.student||!session.student.student_id)return [];
  const key="stsBag_"+session.student.student_id;

  try{
    const raw=JSON.parse(localStorage.getItem(key)||"[]");
    if(!Array.isArray(raw))return [];

    /* Keep one entry per PROPERTY + ROOM TYPE.
       Different room types under the same property are allowed. */
    const seen=new Set();
    const cleaned=raw.filter(item=>{
      const propertyKey=String(item.propertyId ?? "");
      const roomKey=String(item.roomTypeId ?? "");
      const uniqueKey=propertyKey+"::"+roomKey;

      /* Legacy entries without a room type fall back to their id. */
      const finalKey=(roomKey ? uniqueKey : propertyKey+"::legacy::"+String(item.id||""));

      if(seen.has(finalKey))return false;
      seen.add(finalKey);
      return true;
    });

    if(cleaned.length!==raw.length){
      localStorage.setItem(key,JSON.stringify(cleaned));
      localStorage.setItem("stsBag",JSON.stringify(cleaned));
    }

    return cleaned;
  }catch(e){
    return [];
  }
}

function save(b){
  const session=getStudentSession();
  if(!session||!session.student||!session.student.student_id)return;
  const key="stsBag_"+session.student.student_id;
  localStorage.setItem(key,JSON.stringify(b));
  localStorage.setItem("stsBag",JSON.stringify(b));
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function money(n){
  return "₹"+Number(n||0).toLocaleString("en-IN");
}

function monthly(item){
  return Number(item.roomPrice||0)+(item.addons||[]).reduce((s,a)=>s+Number(a.price||0),0);
}

function showMessage(m){
  const t=document.getElementById("toast");
  t.textContent=m;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2400);
}

function selectItem(index){
  const b=bag();
  if(index<0 || index>=b.length)return;

  const pos=selectedIndexes.indexOf(index);

  if(pos>=0){
    selectedIndexes.splice(pos,1);
    render();
    return;
  }

  if(selectedIndexes.length>=MAX_SELECTED){
    showMessage("You can select a maximum of 2 options.");
    return;
  }

  selectedIndexes.push(index);
  render();
}

function removeItem(id){
  const old=bag();
  const removedIndex=old.findIndex(x=>String(x.id)===String(id));
  const b=old.filter(x=>String(x.id)!==String(id));

  selectedIndexes=selectedIndexes
    .filter(i=>i!==removedIndex)
    .map(i=>i>removedIndex?i-1:i);

  save(b);
  render();
}

function compareRows(b){
  const names=b.map(x=>esc(x.propertyName||"Accommodation"));
  const room=b.map(x=>esc(x.roomTypeName||"—"));
  const price=b.map(x=>money(x.roomPrice));
  const extras=b.map(x=>(x.addons||[]).length
    ? x.addons.map(a=>esc(a.name)+" — "+money(a.price)).join("<br>")
    : "None");
  const totals=b.map(x=>money(monthly(x)));
  return `
    <div class="compare">
      <h2>Compare your shortlisted stays</h2>
      <table>
        <thead><tr><th>Compare</th>${names.map(n=>`<th>${n}</th>`).join("")}</tr></thead>
        <tbody>
          <tr><th>Selected room</th>${room.map(x=>`<td>${x}</td>`).join("")}</tr>
          <tr><th>Room price</th>${price.map(x=>`<td>${x} / month</td>`).join("")}</tr>
          <tr><th>Optional facilities</th>${extras.map(x=>`<td>${x}</td>`).join("")}</tr>
          <tr><th>Monthly total</th>${totals.map(x=>`<td><strong>${x}</strong></td>`).join("")}</tr>
        </tbody>
      </table>
    </div>`;
}

function requestForm(items){
  if(!Array.isArray(items) || !items.length)return "";

  const selectedSummary=items.map((item,i)=>`
    <div class="selected-request-item">
      <strong>${i+1}. ${esc(item.propertyName||"Accommodation")}</strong>
      <span>${esc(item.roomTypeName||"Room")} — ${money(monthly(item))} / month</span>
    </div>
  `).join("");

  return `
    <section class="form-card" id="requestForm">
      <h2>Finalise your accommodation request</h2>
      <p>
        You have selected <strong>${items.length} option${items.length===1?"":"s"}</strong>.
        Fill in your details and we’ll create your booking request. There is no online payment here —
        Shift The Stay will receive the selected options and contact you to arrange the next step and a physical property visit.
      </p>
      <div class="selected-request-list">
        ${selectedSummary}
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Full Name *</label>
          <input id="fName" value="${esc(getStudentSession()?.student?.name||"")}" placeholder="Your full name">
        </div>
        <div class="field">
          <label>Phone Number *</label>
          <div class="phone-wrap">
            <div class="country-picker" id="countryPicker">
              <button type="button" class="country-selected" id="countrySelected">🇮🇳 +91</button>
              <div class="country-menu" id="countryMenu">
                <input id="countrySearch" class="country-search" placeholder="Search country..." autocomplete="off">
                <div class="country-list" id="countryList"></div>
              </div>
            </div>
            <input id="fPhone" class="phone-number" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="Phone number">
          </div>
          <input type="hidden" id="fCountryCode" value="+91">
        </div>
        <div class="field full">
          <label>College / University Name *</label>
          <input id="fUniversity" placeholder="College or university name">
        </div>
        <div class="field">
          <label>Admission / Applicant ID Number *</label>
          <input id="fAdmissionId" placeholder="Admission / applicant ID">
        </div>
        <div class="field" id="courseField">
          <label>Degree / Course *</label>
          <div class="course-picker" id="coursePicker">
            <button type="button" class="course-trigger" id="courseSelected" aria-haspopup="listbox" aria-expanded="false">
              <span id="courseSelectedLabel">Select your degree / course</span><span class="course-chevron">⌄</span>
            </button>
            <div class="course-menu" id="courseMenu" role="dialog" aria-label="Select your degree or course">
              <input id="courseSearch" class="course-search" type="search" placeholder="Search degree or course..." autocomplete="off" aria-label="Search degree or course">
              <div class="course-list" id="courseList" role="listbox"></div>
            </div>
          </div>
          <input type="hidden" id="fCourse" value="">
          <div class="other-course-wrap" id="otherCourseWrap" hidden>
            <input id="fOtherCourse" type="text" placeholder="Enter your degree / course name">
          </div>
        </div>
        <div class="field">
          <label>Year *</label>
          <select id="fYear">
            <option value="" selected disabled>Select your year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="primary" id="receiptBtn" onclick="submitRequest()">GET BOOKING RECEIPT</button>
      </div>
    </section>`;
}

function renderReceipt(data){
  const r=data.request||{};
  const items=Array.isArray(r.selected_items)&&r.selected_items.length
    ? r.selected_items
    : [{
        property_name:r.property_name||"—",
        room_type_name:r.room_type_name||"—",
        room_price:Number(r.monthly_total||0),
        addon_total:0,
        monthly_total:Number(r.monthly_total||0),
        addons:[]
      }];

  const accommodationHtml=items.map((item,index)=>{
    const addons=Array.isArray(item.addons)&&item.addons.length
      ? `<div style="margin-top:6px;font-size:14px;color:#526048">${item.addons.map(a=>`+ ${esc(a.name||"Facility")} — ${money(a.price||0)}`).join("<br>")}</div>`
      : "";

    return `<div style="padding:14px 0;border-bottom:${index===items.length-1?"0":"1px solid #cfd6c5"}">
      <strong>${index+1}. ${esc(item.property_name||"Accommodation")}</strong><br>
      ${esc(item.room_type_name||"Room")} — ${money(item.room_price||0)} / month
      ${addons}
      <br><strong>Monthly total: ${money(item.monthly_total||0)}</strong>
    </div>`;
  }).join("");

  document.getElementById("content").innerHTML=`
    <div class="receipt">
      <div class="ok">✓ Booking request created successfully</div>
      <h2>Your Booking Receipt</h2>
      <p>Your request has been recorded. Shift The Stay will contact you to arrange the next step and a physical visit.</p>

      <div class="receipt-grid">
        <div><strong>Request ID</strong><br>${esc(r.request_id||"—")}</div>
        <div><strong>Options selected</strong><br>${items.length}</div>
        <div style="grid-column:1/-1"><strong>Selected accommodations</strong><br>${accommodationHtml}</div>
        <div><strong>Name</strong><br>${esc(r.student_name||"—")}</div>
        <div><strong>Phone</strong><br>${esc(r.phone||"—")}</div>
      </div>

      <p><strong>Please keep your Request ID: ${esc(r.request_id||"")}</strong></p>
    </div>`;
}

function render(){
  const b=bag();
  if(!b.length){
    selectedIndexes=[];
    document.getElementById("content").innerHTML=
      '<div class="empty"><h2>Your shortlist is empty.</h2><p>Select rooms and optional facilities from property pages to compare your stays.</p><button class="primary" onclick="location.href=\'index.html\'">FIND A STAY</button></div>';
    return;
  }

  selectedIndexes=selectedIndexes.filter(i=>i>=0 && i<b.length);

  const html=b.map((item,i)=>{
    const isSelected=selectedIndexes.includes(i);
    const extras=(item.addons||[]).length
      ? item.addons.map(a=>`+ ${esc(a.name)} — ${money(a.price)}`).join("<br>")
      : "No optional facilities selected";
    return `<article class="item ${isSelected?"selected":""}">
      <img src="${esc(item.propertyImage||"building.jpg")}" onerror="this.src='building.jpg'">
      <div>
        <h3>${esc(item.propertyName||"Accommodation")}</h3>
        <div class="meta">
          <strong>${esc(item.roomTypeName||"Room")}</strong> — ${money(item.roomPrice)} / month<br>
          ${extras}<br>
          <strong>Monthly total: ${money(monthly(item))}</strong>
          ${isSelected?'<br><strong style="color:#31501f">✓ Selected for final request</strong>':""}
        </div>
      </div>
      <div class="item-actions">
        <button class="select-btn ${isSelected?"selected-btn":""}" onclick="selectItem(${i})">${isSelected?"✓ SELECTED":"SELECT THIS"}</button>
        <button class="remove" onclick="removeItem('${esc(item.id)}')">Remove</button>
      </div>
    </article>`;
  }).join("");

  document.getElementById("content").innerHTML=`
    <p class="subtitle">You can shortlist multiple properties and room types for comparison, but you can select a maximum of <strong>2 options</strong>.</p>
    <div class="notice">
      <strong>Select up to 2 stays — compare them, visit them, then continue.</strong>
      <p>You may keep multiple options in your shortlist. When you are ready, select up to two options below. After you click Continue, only the selected option(s) will be sent to Shift The Stay for your accommodation request.</p>
      <p><strong>Selected: ${selectedIndexes.length} / ${MAX_SELECTED}</strong></p>
    </div>
    <div class="bag-list">${html}</div>
    ${b.length>1?compareRows(b):""}
    <div class="total">
      <div>
        <strong>${selectedIndexes.length ? `${selectedIndexes.length} option${selectedIndexes.length===1?"":"s"} selected` : "Select up to 2 options to continue"}</strong>
        <small>${selectedIndexes.length ? "Only these selected options will be sent to Shift The Stay." : "You can select a maximum of 2 options."}</small>
      </div>
      <button class="primary" ${selectedIndexes.length?"":"disabled"} onclick="showRequestForm()">CONTINUE</button>
    </div>
    <div id="formMount"></div>`;
}

function showRequestForm(){
  const b=bag();
  const selectedItems=selectedIndexes
    .filter(i=>i>=0 && i<b.length)
    .map(i=>b[i]);

  if(!selectedItems.length){
    showMessage("Please select at least one option.");
    return;
  }

  document.getElementById("formMount").innerHTML=requestForm(selectedItems);
  initCountryPicker();
  initCoursePicker();
  document.getElementById("requestForm").scrollIntoView({behavior:"smooth",block:"start"});
}

let selectedCountry=countries.find(c=>c[0]==="India")||countries[0];
function renderCountryList(query=""){
  const q=query.trim().toLowerCase(), list=document.getElementById("countryList");
  const filtered=countries.filter(c=>c[0].toLowerCase().includes(q)||c[1].includes(q));
  list.innerHTML=filtered.length?filtered.map(c=>`<button type="button" class="country-option" data-name="${esc(c[0])}" data-code="${esc(c[1])}" data-flag="${esc(c[2])}"><span>${esc(c[2])} ${esc(c[0])}</span><span class="dial">${esc(c[1])}</span></button>`).join(""):'<div style="padding:12px;color:#526048">No country found</div>';
  list.querySelectorAll(".country-option").forEach(btn=>btn.addEventListener("click",()=>{
    selectedCountry=[btn.dataset.name,btn.dataset.code,btn.dataset.flag];
    document.getElementById("countrySelected").textContent=`${selectedCountry[2]} ${selectedCountry[1]}`;
    document.getElementById("fCountryCode").value=selectedCountry[1];
    document.getElementById("countryMenu").classList.remove("open");
    document.getElementById("countrySelected").setAttribute("aria-expanded","false");
    document.getElementById("countrySearch").value=""; renderCountryList(""); document.getElementById("fPhone").focus();
  }));
}
function initCountryPicker(){
  renderCountryList("");
  const trigger=document.getElementById("countrySelected"), menu=document.getElementById("countryMenu"), search=document.getElementById("countrySearch");
  trigger?.addEventListener("click",()=>{const open=menu.classList.toggle("open");trigger.setAttribute("aria-expanded",String(open));if(open){search.value="";renderCountryList("");setTimeout(()=>search.focus(),0);}});
  search?.addEventListener("input",()=>renderCountryList(search.value));
  document.getElementById("fPhone")?.addEventListener("input",()=>clearFieldInvalid("fPhone"));
  document.addEventListener("click",e=>{const picker=document.getElementById("countryPicker");if(picker&&!picker.contains(e.target)){menu.classList.remove("open");trigger.setAttribute("aria-expanded","false");}});
}

const COURSE_OPTIONS=[
  "B.Tech / B.E.","B.Arch","B.Des","B.Sc.","B.A.","B.Com.","BBA","BCA","BJMC","B.Ed.","B.Pharm","BPT","BHM","MBBS","BDS","LLB",
  "M.Tech / M.E.","M.Arch","M.Des","M.Sc.","M.A.","M.Com.","MBA","MCA","MJMC","M.Ed.","M.Pharm","MPT","MHM","MD","MS (Medical)","MDS","LLM",
  "Ph.D.","Diploma / Polytechnic","CA","CS","CMA","Other"
];
let selectedCourse="";

function renderCourseList(query="") {
  const list=document.getElementById("courseList");
  if(!list)return;
  const q=String(query||"").trim().toLowerCase();
  const filtered=COURSE_OPTIONS.filter(c=>c.toLowerCase().includes(q));
  list.innerHTML=filtered.length
    ? filtered.map(c=>`<button type="button" class="course-option ${c==="Other"?"other":""}" data-course="${esc(c)}" role="option">${esc(c)}${c==="Other"?"<span>+</span>":""}</button>`).join("")
    : '<div class="course-empty">No matching course. Choose <strong>Other</strong> to enter it manually.</div>';
  list.querySelectorAll(".course-option").forEach(btn=>btn.addEventListener("click",()=>chooseCourse(btn.dataset.course)));
}

function chooseCourse(course){
  selectedCourse=course||"";
  const menu=document.getElementById("courseMenu"),trigger=document.getElementById("courseSelected"),label=document.getElementById("courseSelectedLabel");
  const hidden=document.getElementById("fCourse"), otherWrap=document.getElementById("otherCourseWrap"), otherInput=document.getElementById("fOtherCourse");
  hidden.value=selectedCourse;
  label.textContent=selectedCourse||"Select your degree / course";
  trigger.classList.toggle("has-value",!!selectedCourse);
  clearFieldInvalid("courseSelected");
  menu.classList.remove("open");
  trigger.setAttribute("aria-expanded","false");
  document.getElementById("courseSearch").value="";
  renderCourseList("");
  if(selectedCourse==="Other"){
    otherWrap.hidden=false;
    setTimeout(()=>otherInput?.focus(),0);
  }else{
    otherWrap.hidden=true;
    if(otherInput)otherInput.value="";
  }
}

function initCoursePicker(){
  const picker=document.getElementById("coursePicker"), trigger=document.getElementById("courseSelected"), menu=document.getElementById("courseMenu"), search=document.getElementById("courseSearch");
  if(!picker||!trigger||!menu||!search)return;
  renderCourseList("");
  trigger.addEventListener("click",()=>{
    const open=menu.classList.toggle("open");
    trigger.setAttribute("aria-expanded",String(open));
    if(open){search.value="";renderCourseList("");setTimeout(()=>search.focus(),0);}
  });
  search.addEventListener("input",()=>renderCourseList(search.value));
  document.addEventListener("click",e=>{
    if(!picker.contains(e.target)){
      menu.classList.remove("open");
      trigger.setAttribute("aria-expanded","false");
    }
  });
  search.addEventListener("keydown",e=>{
    if(e.key==="Escape"){menu.classList.remove("open");trigger.setAttribute("aria-expanded","false");trigger.focus();}
  });
  document.getElementById("fOtherCourse")?.addEventListener("input",()=>clearFieldInvalid("fOtherCourse"));
}

function markFieldInvalid(id, message){
  const el=document.getElementById(id);
  const field=el?.closest(".field");
  if(!field)return;
  let err=field.querySelector(".field-error");
  if(!err){err=document.createElement("div");err.className="field-error";field.appendChild(err);}
  err.textContent=message;
  field.classList.add("invalid");
}

function clearFieldInvalid(id){
  const el=document.getElementById(id);
  const field=el?.closest(".field");
  field?.classList.remove("invalid");
}

async function submitRequest(){
  const session=getStudentSession();
  const b=bag();
  const selectedItems=selectedIndexes
    .filter(i=>i>=0 && i<b.length)
    .map(i=>b[i]);

  if(!session||!session.session_token||!session.student?.student_id){
    showMessage("Please sign in again.");
    return;
  }
  if(!selectedItems.length){
    showMessage("Please select at least one option.");
    return;
  }
  if(selectedItems.length>MAX_SELECTED){
    showMessage("You can select a maximum of 2 options.");
    return;
  }

  const phoneNumber=document.getElementById("fPhone").value.replace(/\D/g,"").trim();
  const selectedCourseValue=document.getElementById("fCourse").value.trim();
  const otherCourseValue=document.getElementById("fOtherCourse")?.value.trim()||"";
  const finalCourse=selectedCourseValue==="Other"?otherCourseValue:selectedCourseValue;

  const fields={
    name:document.getElementById("fName").value.trim(),
    phone:(document.getElementById("fCountryCode").value||"+91")+" "+phoneNumber,
    university:document.getElementById("fUniversity").value.trim(),
    admissionId:document.getElementById("fAdmissionId").value.trim(),
    course:finalCourse,
    year:document.getElementById("fYear").value.trim()
  };

  ["fName","fUniversity","fAdmissionId","fYear"].forEach(clearFieldInvalid);
  clearFieldInvalid("fPhone");
  clearFieldInvalid("courseSelected");
  clearFieldInvalid("fOtherCourse");

  if(!fields.name){markFieldInvalid("fName","Please enter your full name.");document.getElementById("fName").focus();showMessage("Please enter your full name.");return;}
  if(!phoneNumber){markFieldInvalid("fPhone","Phone number is required.");document.getElementById("fPhone").focus();showMessage("Phone number is required.");return;}
  if(phoneNumber.length<7||phoneNumber.length>15){markFieldInvalid("fPhone","Enter a valid phone number.");document.getElementById("fPhone").focus();showMessage("Enter a valid phone number.");return;}
  if(!fields.university){markFieldInvalid("fUniversity","Please enter your university or college.");document.getElementById("fUniversity").focus();showMessage("Please enter your university or college.");return;}
  if(!fields.admissionId){markFieldInvalid("fAdmissionId","Admission / applicant ID is required.");document.getElementById("fAdmissionId").focus();showMessage("Admission / applicant ID is required.");return;}
  if(!selectedCourseValue){markFieldInvalid("courseSelected","Please choose a degree / course.");document.getElementById("courseSelected").focus();showMessage("Please choose a degree / course.");return;}
  if(selectedCourseValue==="Other"&&!otherCourseValue){markFieldInvalid("fOtherCourse","Please enter your degree / course name.");document.getElementById("fOtherCourse").focus();showMessage("Please enter your degree / course name.");return;}
  if(!fields.year){markFieldInvalid("fYear","Please select your year.");document.getElementById("fYear").focus();showMessage("Please select your year.");return;}

  const button=document.getElementById("receiptBtn");
  button.disabled=true;
  button.textContent="CREATING RECEIPT...";

  const first=selectedItems[0];

  try{
    const payload=new URLSearchParams({
      action:"createBookingRequest",
      session_token:session.session_token,
      name:fields.name,
      phone:fields.phone,
      university:fields.university,
      admissionId:fields.admissionId,
      course:fields.course,
      year:fields.year,

      /* Kept for compatibility with the existing backend/sheet. */
      selected_property_id:String(first.propertyId||""),
      selected_property_name:String(first.propertyName||""),
      selected_room_type_id:String(first.roomTypeId||""),
      selected_room_type_name:String(first.roomTypeName||""),
      selected_room_price:String(Number(first.roomPrice||0)),
      selected_addons:JSON.stringify(first.addons||[]),

      /* These are the options the student actually selected.
         The backend will store each selected option in RequestSelections. */
      selected_items:JSON.stringify(selectedItems),

      /* Keep the full shortlist available to the backend as context. */
      shortlisted_items:JSON.stringify(b)
    });

    const response=await fetch(API_URL,{
      method:"POST",
      body:payload
    });

    if(!response.ok)throw new Error("Request failed ("+response.status+")");

    const data=await response.json();
    if(!data.success)throw new Error(data.error||"Could not create booking request.");

    save([]);
    selectedIndexes=[];
    renderReceipt(data);
  }catch(e){
    button.disabled=false;
    button.textContent="GET BOOKING RECEIPT";
    showMessage(e.message||"Something went wrong.");
  }
}

const currentSession=getStudentSession();

if(!currentSession||!currentSession.session_token||!currentSession.student||!currentSession.student.student_id){
  document.getElementById("content").innerHTML=`
    <div class="empty">
      <h2>Sign in to view your shortlist.</h2>
      <p>Your shortlisted accommodations are saved to your student account.</p>
      <button class="primary" onclick="location.href='index.html?loginRequired=1&returnTo=bag.html'">SIGN IN</button>
    </div>`;
}else{
  render();
}
</script>
